<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgroClima IS71</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

<header>
    <img src="logo-agroclima.png" class="logo">
    <h1>AgroClima IS71</h1>
    <p class="lema">"Del cielo al campo, con ciencia"</p>
</header>

<main>

    <section class="tarjeta">
        <h2>Temperatura</h2>
        <p id="temp" class="dato">Cargando...</p>
    </section>

    <section class="tarjeta">
        <h2>Humedad</h2>
        <p id="humedad" class="dato">Cargando...</p>
    </section>

    <section class="tarjeta">
        <h2>Presión</h2>
        <p id="presion" class="dato">Cargando...</p>
    </section>

    <section class="tarjeta">
        <h2>Velocidad del viento</h2>
        <p id="viento" class="dato">Cargando...</p>
    </section>

    <section class="tarjeta">
        <h2>Lluvia (última hora)</h2>
        <p id="lluvia" class="dato">Cargando...</p>
    </section>

</main>

<script src="script.js"></script>
</body>
</html>
